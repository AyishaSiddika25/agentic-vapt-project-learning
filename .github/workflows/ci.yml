name: Agentic VAPT CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and validation tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile
        run: python -m compileall -q agentic_vapt tests
      - name: Lint
        run: ruff check agentic_vapt tests
      - name: Test integrated pipeline
        run: python -m unittest discover -s tests -v
      - name: Test preserved Day-06 adapter
        run: python Day-06/test_semgrep_adapter.py
      - name: Run safe local demo
        run: python -m agentic_vapt --sarif examples/demo.sarif --config examples/demo_config.json --output-dir reports/demo --exit-zero

