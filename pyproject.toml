[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-vapt"
version = "0.1.0"
description = "A safe, explainable Agentic VAPT finding pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Educational use" }
authors = [{ name = "Agentic VAPT contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.8,<1"]

[project.scripts]
agentic-vapt = "agentic_vapt.__main__:main"

[tool.setuptools.packages.find]
include = ["agentic_vapt*"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [".venv", "Day-01", "Day-02", "Day-03", "Day-04", "Day-05", "Day-06", "Day-07", "Day-08", "Day-09", "Day-10", "Day-11", "Day-12"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "PERF", "RUF", "SIM"]

